{% extends "base.html" %}

<!-- Open Graph / Twitter Cards: usa title/description do front matter de cada
     página, com fallback para a descrição do site. -->
{% block extrahead %}
{{ super() }}
{% if page %}
{% set page_description = page.meta.description or config.site_description %}
<meta property="og:type" content="website" />
<meta property="og:site_name" content="{{ config.site_name }}" />
<meta property="og:title" content="{{ page.title }} | {{ config.site_name }}" />
<meta property="og:description" content="{{ page_description }}" />
<meta property="og:url" content="{{ page.canonical_url }}" />
<meta property="og:image" content="{{ config.site_url }}assets/logo.png" />
<meta name="twitter:card" content="summary" />
<meta name="twitter:title" content="{{ page.title }} | {{ config.site_name }}" />
<meta name="twitter:description" content="{{ page_description }}" />
<meta name="twitter:image" content="{{ config.site_url }}assets/logo.png" />
{% endif %}
{% endblock %}
