site_name: HYMPLE
site_url: https://hy-mple.github.io/hymple.docs/
site_description: Hybrid by nature, simple by choice - Next-generation hybrid decentralized exchange

# Theme Configuration
theme:
  name: material
  language: en
  font:
    text: Inter
    code: JetBrains Mono
  
  palette:
    # Light mode - GitBook style
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Dark mode - GitBook style
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  
  features:
    - announce.dismiss
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - navigation.expand
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.path
    - navigation.prune
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
    - toc.integrate
  
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye
    logo: material/currency-usd-circle
  
  logo: assets/logo.png
  favicon: assets/logo.png

# Navigation Structure
nav:
  - Home: index.md
  - 1. Introduction: 2 - introduction.md
  - 2. From Traditional to Hybrid: 3 - from_traditional_to_hybrid.md
  - 3. Global Exchange Landscape: 4 - globalExchangeLandscape.md
  - 4. Benefits: 5 - benefits.md
  - 5. Architecture: 6 - architecture.md
  - 6. Observability & Monitoring: 7 - observability&MonitoringLayer.md
  - 7. User Experience & Onboarding: 8 - userExperience&OnboardingFlow.md

# Plugins
plugins:
  - search:
      lang: en
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: slide
      width: 100%
      height: auto
      zoomable: true
      draggable: true
      skip_classes:
        - custom-skip-class-name
      auto_caption: false
      caption_position: bottom
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
      htmlmin_opts:
        remove_comments: true
      cache_safe: true

# Extensions
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: false
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      use_pygments: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
  - pymdownx.tasklist:
      custom_checkbox: true

# Extra CSS for custom navigation cards
extra_css:
  - stylesheets/styles.css

# Extra JavaScript
extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

# Remove "Made with Material for MkDocs" from footer
extra:
  generator: false
  social:
    - icon: fontawesome/brands/x-twitter
      link: https://twitter.com/hymple
      name: Hymple on X
  analytics:
    provider: google
    property: !ENV GOOGLE_ANALYTICS_KEY

# Copyright
copyright: |
  Copyright &copy; 2025 <a href="https://hymple.exchange" target="_blank" rel="noopener">Hymple Exchange</a> - All rights reserved
