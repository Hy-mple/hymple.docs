site_name: HYMPLE
site_url: https://docs.hymple.com/
site_description: Hybrid by nature, simple by choice - Next-generation hybrid decentralized exchange

# Theme Configuration
theme:
  name: material
  language: en
  custom_dir: overrides
  font:
    text: Inter
    code: JetBrains Mono
  
  palette:
    # Light mode - GitBook style
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Dark mode - GitBook style
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  
  features:
    - announce.dismiss
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - navigation.expand
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.path
    - navigation.prune
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
    - toc.integrate
  
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye
    logo: material/currency-usd-circle
  
  logo: assets/logo.png
  favicon: assets/logo.png

# Navigation Structure
nav:
  - 🏠 Home: index.md
  - 📖 Introduction: introduction.md
  - 🔄 From Traditional to Hybrid: from-traditional-to-hybrid.md
  - 🌍 Global Exchange Landscape: global-exchange-landscape.md
  - ✨ Benefits: benefits.md
  - 🏗️ Architecture: architecture.md
  - 🔐 Settlement & Withdrawals: custody-withdrawals.md
  - 📊 Observability & Monitoring: observability-monitoring.md
  - 👤 User Experience & Onboarding: user-experience-onboarding.md
  - 🔒 Advanced Security Architecture: security-architecture.md
  - 🚨 Operational Resilience & Incident Response: operational-resilience.md
  - 🛡️ Anti-Manipulation and Anti-Abuse Protocols: anti-manipulation-protocols.md
  - ⚖️ Conflict and Dispute Resolution Mechanism: dispute-resolution.md
  - ⚠️ System Limitations & Assumptions: system-limitations.md
  - 🏛️ Technical Governance Framework: governance-framework.md
  - 🔍 Audit & Transparency Model: audit-transparency.md
  - 🎯 Risk Disclosure & Threat Model: risk-disclosure-threat-model.md
  - 💰 Tokenomics: tokenomics.md
  - 🪙 Token Utility: token-utility.md
  - 🎁 Rewards: rewards.md
  - 📈 Staking: staking.md
  - 💵 Fees: fees.md
  - 🔥 Burn Policy: burn-policy.md

# Plugins
plugins:
  - search:
      lang: en
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: slide
      width: 100%
      height: auto
      zoomable: true
      draggable: true
      skip_classes:
        - custom-skip-class-name
      auto_caption: false
      caption_position: bottom

# Extensions
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: false
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      use_pygments: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
  - pymdownx.tasklist:
      custom_checkbox: true

# Extra CSS for custom navigation cards
extra_css:
  - stylesheets/styles.css

# Extra JavaScript
extra_javascript:
  - javascripts/mathjax.js
  - javascripts/sidebar-adjust.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

# Remove "Made with Material for MkDocs" from footer
extra:
  generator: false
  social:
    - icon: fontawesome/brands/x-twitter
      link: https://twitter.com/hymple
      name: Hymple on X
  analytics:
    provider: google
    property: !ENV GOOGLE_ANALYTICS_KEY

